<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>TOP 10 ACTIF | Mr XPRONOS</title>

<meta
name="description"
content="Top 10 pronostics les plus fiables selon le moteur XPRONOS V4">

<style>

:root{

--bg:#08131f;
--card:#102338;
--gold:#FFD700;
--green:#00c853;
--cyan:#26d5ff;
--muted:#9fb7cf;
--border:#1b3249;

}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:
Inter,
Arial,
sans-serif;

background:var(--bg);

color:white;

min-height:100vh;

padding:20px;
}

.container{

max-width:1200px;

margin:auto;
}

.hero{

text-align:center;

margin-bottom:25px;
}

.hero h1{

font-size:clamp(
28px,
5vw,
50px
);

color:var(--gold);

margin-bottom:10px;
}

.hero p{

color:var(--muted);

max-width:700px;

margin:auto;
}

.toolbar{

display:flex;

justify-content:center;

margin-bottom:30px;
}

select{

background:#102338;

color:white;

border:1px solid var(--border);

padding:12px 15px;

border-radius:12px;

font-size:15px;

min-width:240px;
}

.matches{

display:grid;

gap:18px;
}

.card{

background:

linear-gradient(
145deg,
#102338 0%,
#08131f 100%
);

border:

1px solid var(--border);

border-radius:20px;

padding:20px;

box-shadow:
0 10px 30px
rgba(0,0,0,.30);
}

.card-header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:15px;
}

.rank{

font-size:24px;

font-weight:900;

color:var(--gold);
}

.status{

background:var(--green);

padding:6px 10px;

border-radius:999px;

font-size:12px;

font-weight:800;
}

.competition{

color:var(--cyan);

font-weight:700;

margin-bottom:6px;
}

.match-time{

font-size:13px;

color:var(--muted);

margin-bottom:15px;
}

.teams{

display:flex;

justify-content:center;

align-items:center;

gap:20px;

margin-bottom:15px;
}

.logo{

width:80px;

height:80px;

object-fit:contain;
}

.vs{

font-size:22px;

font-weight:900;

color:var(--gold);
}

.match-name{

text-align:center;

font-size:20px;

font-weight:800;

margin-bottom:18px;
}

.score-box{

text-align:center;

margin-bottom:18px;
}

.score-label{

font-size:13px;

color:var(--muted);
}

.score-value{

font-size:28px;

font-weight:900;

color:var(--gold);
}

.pick{

padding:12px;

border-radius:12px;

margin-bottom:10px;

font-weight:700;
}

.primary{

background:
rgba(0,200,83,.12);

color:#55ff9b;
}

.secondary{

background:
rgba(38,213,255,.12);

color:#79e4ff;
}

.exact{

margin-top:12px;

padding:12px;

background:

rgba(255,215,0,.08);

border-radius:12px;

color:#ffd36e;

font-weight:700;
}

.footer{

margin-top:40px;

text-align:center;

font-size:13px;

color:var(--muted);
}

@media(max-width:768px){

body{
padding:10px;
}

.card{
padding:15px;
}

.logo{

width:55px;
height:55px;
}

.match-name{

font-size:17px;
}

.score-value{

font-size:23px;
}

.vs{

font-size:18px;
}

select{

width:100%;
}

}

</style>

</head>

<body>

<div class="container">

<div class="hero">

<h1>

🏆 TOP 10 ACTIF XPRONOS

</h1>

<p>

Les meilleurs matchs sélectionnés
par le moteur XPRONOS V4
avec confiance minimale de 80%.

</p>

</div>

<div class="toolbar">

<select id="leagueFilter">

<option value="all">

Tous les championnats

</option>

</select>

</div>

<div
id="matchesContainer"
class="matches">

</div>

<div class="footer">

Mr XPRONOS V4 • Analyse automatisée

</div>

</div>

<script src="assets/js/top10.js"></script>

</body>

  </html>
